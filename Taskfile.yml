version: '3'

vars:
  REGISTRY: '{{.REGISTRY | default "ghcr.io/pyck-ai"}}'
  CI: '{{.CI | default ""}}'
  # The buildx builder `task build` uses. The shared build-image workflow
  # passes its own with BUILDER=<name>; `task setup` creates the default.
  BUILDER: '{{.BUILDER | default "flutter-rfw"}}'

  _BAKE_BUILDARGS:
    sh: >-
      cat buildargs.conf | grep -v '^#' | grep -v '^$' | sed 's/^/--set *.args./' | tr '\n' ' '

  _HOST_ARCH:
    sh: >-
      uname -m

dotenv:
  - buildargs.conf

tasks:
  setup:
    desc: "Create the 'flutter-rfw' buildx builder (run once per machine)"
    cmds:
      - |
        docker buildx inspect flutter-rfw 2>/dev/null || \
        docker buildx create \
          --name=flutter-rfw \
          --driver=docker-container

  build:
    desc: "Build the image using Docker Bake. Args: TARGET=<alpine|debian, space-separated; default both>, BUILDER=<buildx builder>, ARCH=arm64"
    cmds:
      # Under CI=true (the shared build-image workflow) no local-only flags:
      # no host platform and no cache clearing; the pipeline's own overrides
      # in CLI_ARGS decide caching and pushing.
      # THROWAWAY DIAGNOSTIC (never merge): sample disk use while bake runs.
      - |
        ( while [ ! -f /tmp/diag-stop ]; do echo "DIAG-DF $(date +%T) root=$(df -B1M --output=used,size / | tail -1 | tr -s ' ') bk=$(df -B1M --output=used,size ${RUNNER_INIT_BUILDKIT_ROOT:-/home/nonroot/.local/share/buildkit} 2>/dev/null | tail -1 | tr -s ' ')"; sleep 10; done ) &
        df -h / ${RUNNER_INIT_BUILDKIT_ROOT:-/home/nonroot/.local/share/buildkit} ${HOME}/.local/share/containers 2>&1 | sed 's/^/DIAG-START /'
        rc=0
        docker buildx bake --pull --builder {{.BUILDER | q}} {{if not .CI}}--set {{ (printf "*.platform=linux/%s" (.ARCH | default ._HOST_ARCH)) | q}} --set "*.cache-from=" --set "*.cache-to="{{end}} --var REGISTRY={{ .REGISTRY | q}} {{._BAKE_BUILDARGS}} {{if .CLI_VERBOSE}}--debug{{end}} {{.BAKE_EXTRA}} {{.CLI_ARGS}} --set "*.cache-from=" {{.TARGET}} || rc=$?
        touch /tmp/diag-stop; sleep 11
        df -h / ${RUNNER_INIT_BUILDKIT_ROOT:-/home/nonroot/.local/share/buildkit} 2>&1 | sed 's/^/DIAG-END /'
        exit $rc
      - >-
        true
        --pull
        --builder {{.BUILDER | q}}
        {{if not .CI}}--set {{ (printf "*.platform=linux/%s" (.ARCH | default ._HOST_ARCH)) | q}} --set "*.cache-from=" --set "*.cache-to="{{end}}
        --var REGISTRY={{ .REGISTRY | q}}
        {{._BAKE_BUILDARGS}}
        {{if .CLI_VERBOSE}}--debug{{end}}
        {{.BAKE_EXTRA}}
        {{.CLI_ARGS}}
        {{.TARGET}}
