version: '3'

vars:
  REGISTRY: '{{.REGISTRY | default "ghcr.io/pyck-ai"}}'
  CI: '{{.CI | default ""}}'

  _BAKE_BUILDARGS:
    sh: >-
      cat buildargs.conf | grep -v '^#' | grep -v '^$' | sed 's/^/--set *.args./' | tr '\n' ' '

  _HOST_ARCH:
    sh: >-
      uname -m

dotenv:
  - buildargs.conf

tasks:
  setup:
    desc: "Create the 'flutter-rfw' buildx builder (run once per machine)"
    cmds:
      - |
        docker buildx inspect flutter-rfw 2>/dev/null || \
        docker buildx create \
          --name=flutter-rfw \
          --driver=docker-container

  build:
    desc: "Build the image using Docker Bake. Args: ARCH=arm64, -- alpine|debian"
    cmds:
      - >-
        docker buildx bake
        --pull
        --builder flutter-rfw
        {{if not .CI}}--set {{ (printf "*.platform=linux/%s" (.ARCH | default ._HOST_ARCH)) | q}}{{end}}
        --set "*.cache-from="
        --set "*.cache-to="
        --var REGISTRY={{ .REGISTRY | q}}
        {{._BAKE_BUILDARGS}}
        {{if .CLI_VERBOSE}}--debug{{end}}
        {{.BAKE_EXTRA}}
        {{.CLI_ARGS}}
