version: 1
buildargs: buildargs.conf
registry: ghcr.io/pyck-ai

# Transcribed 1:1 from this repo's verify.sh / verify-image.sh / verify-lib.sh
# (bash) into the imgverify manifest schema. Checks appear in the exact order
# verify-image.sh executes them. Unlike baseimages, images here are top level
# (ghcr.io/pyck-ai/flutter-rfw), not nested under a sub-path — see
# docker-bake.hcl's `vtags()` tag construction.
#
# The final check is the only one that exercises what the image is actually
# for: a real round trip (text .rfwtxt -> binary .rfw -> re-validated binary)
# through the validate-rfw CLI, using the read-only bind mount verify-image.sh
# sets up against the repo root (which holds the example.dart fixture). It
# maps onto `sh` + `mounts` per the schema doc comment in schema.ts, which
# states every host-side check in the org is expressible that way rather than
# via a raw host-shell escape kind.

targets:
  # ---------------------------------------------------------------------
  # flutter-rfw — verify-image.sh (9 check calls), both variants
  # ---------------------------------------------------------------------
  - match: "*"
    checks:
      - kind: user
        uid: 1001
        name: nonroot
      - kind: workdir
        value: /app

      # PUB_CACHE must resolve to the same path at build time (dart pub get,
      # run as nonroot) and run time, or packages resolved during the build
      # land somewhere the runtime user cannot read.
      - kind: env
        name: PUB_CACHE
        equals: /opt/pub-cache

      # Zero-file telemetry suppression must resolve identically at build
      # time and run time; see the ENV comment in the Dockerfiles for why
      # this replaced a build-time `flutter config --no-analytics` call.
      - kind: env
        name: FLUTTER_SUPPRESS_ANALYTICS
        equals: "true"
      - kind: env
        name: DASH__SUPPRESS_ANALYTICS
        equals: "true"

      - kind: cmd
        commands: [flutter, dart, validate-rfw]

      - kind: version
        run: "flutter --version"
        contains: "${FLUTTER_VERSION}"

      # The two .dart scripts were dropped from the image at one point while
      # the build stayed green and validate-rfw was completely dead; assert
      # their presence explicitly rather than trusting a passing build.
      - kind: file
        paths:
          - /opt/rfw-validator/pubspec.yaml
          - /opt/rfw-validator/pubspec.lock
          - /opt/rfw-validator/validate_rfw.dart
          - /opt/rfw-validator/generate_binary.dart
          - /usr/local/bin/validate-rfw

      # Real round-trip: validate-rfw has no ENTRYPOINT, so its first
      # argument is the subcommand (validate-rfw|generate-binary). The repo
      # root (which holds example.dart, a valid .rfwtxt fixture) is
      # bind-mounted read-only at /app — the image runs as uid 1001 and
      # cannot write to a host-owned mount, so the generated binary is
      # written into the container's own /tmp instead.
      - kind: sh
        desc: "validate-rfw round-trip: text -> binary -> binary"
        run: |-
          set -e
          validate-rfw validate-rfw /app/example.dart
          validate-rfw generate-binary /app/example.dart /tmp/example.rfw
          validate-rfw validate-rfw /tmp/example.rfw
        mounts:
          - host: "."
            container: /app
            ro: true
