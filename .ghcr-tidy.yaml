# GHCR retention for pyck-ai/flutter-rfw.
#
# Package names are full names, never a prefix joined to an image name.
# The image is top level; the build cache is nested UNDER it.
version: 1
owner: pyck-ai

# Pre-flight proof, taken before any deletion, that the registry is
# readable and a known-good tag resolves (see ghcr-tidy's
# `ManifestCanary` doc for why this must live here rather than as a
# workflow input: the `tidy-ghcr.yml` caller's `inputs` are empty on a
# `schedule` trigger). `flutter-rfw:alpine` is chosen deliberately:
# `alpine` matches ghcr-tidy's own DEFAULT_PROTECTED_TAGS (`^alpine$`),
# so it is a protected root, always a keep-root, never in DELETE. A
# canary that could itself be deleted would prove nothing.
canary:
  package: flutter-rfw
  tag: alpine

packages:
  # The published image. Multi-arch: each tagged index has 2 platform
  # children plus 2 attestation manifests, all untagged. They are kept by
  # reachability from the tag that points at them, never by being tagged.
  - match: flutter-rfw

  # The build cache. Its tags are overwritten on every push, so the only
  # cost of deleting one is a cold rebuild. `policy: cache` keeps every
  # tagged version; the churn is in the untagged layers underneath.
  - match: flutter-rfw/buildcache
    policy: cache
