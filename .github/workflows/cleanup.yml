name: cleanup
run-name: Cleanup

# Run daily at 12:00 UTC. Jobs are chained sequentially to avoid hitting GitHub API rate limits.
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

# Never cancel a running cleanup job — partial cleanup is worse than no cleanup.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  DRY_RUN: false

  # How long to keep workflow run history.
  WORKFLOWS_RETAIN_DAYS: 30

  # Mark issues stale after RETAIN_DAYS of inactivity, close CLOSE_DAYS after that.
  ISSUES_RETAIN_DAYS: 30
  ISSUES_CLOSE_DAYS: 7

  # Same thresholds for pull requests.
  PRS_RETAIN_DAYS: 30
  PRS_CLOSE_DAYS: 7

  # Delete branches with no activity in this many days (closed PR branches included).
  BRANCHES_RETAIN_DAYS: 90

jobs:
  # Delete workflow runs older than WORKFLOWS_RETAIN_DAYS, keeping at least 1 per workflow.
  clean-old-workflow-runs:
    name: Delete old workflow runs
    runs-on: self-hosted
    permissions:
      actions: write
    steps:
      - uses: Mattraks/delete-workflow-runs@b3018382ca039b53d238908238bd35d1fb14f8ee # v2.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: ${{ env.WORKFLOWS_RETAIN_DAYS }}
          keep_minimum_runs: 1
          dry_run: ${{ env.DRY_RUN }}
          check_branch_existence: false
          check_pullrequest_exist: false

  # Mark issues and PRs stale after RETAIN_DAYS of inactivity and close them CLOSE_DAYS later.
  # Draft PRs are exempt. Runs after workflow cleanup to space out API calls.
  clean-stale-issues-and-prs:
    name: Close stale open PRs
    needs: clean-old-workflow-runs
    runs-on: self-hosted
    permissions:
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-issue-stale: ${{ env.ISSUES_RETAIN_DAYS }}
          days-before-issue-close: ${{ env.ISSUES_CLOSE_DAYS }}
          close-issue-message: 'Closing due to inactivity for more than ${{ env.ISSUES_RETAIN_DAYS }} days.'
          stale-issue-label: 'stale'
          days-before-pr-stale: ${{ env.PRS_RETAIN_DAYS }}
          days-before-pr-close: ${{ env.PRS_CLOSE_DAYS }}
          close-pr-message: 'Closing due to inactivity for more than ${{ env.PRS_RETAIN_DAYS }} days.'
          stale-pr-label: 'stale'
          exempt-draft-pr: true
          delete-branch: false
          operations-per-run: 100
          debug-only: ${{ env.DRY_RUN }}

  # Delete branches with no commits in the last BRANCHES_RETAIN_DAYS days.
  # Runs after stale PR closure so recently-closed PR branches are eligible immediately.
  clean-stale-branches:
    name: Delete stale branches
    needs: clean-stale-issues-and-prs
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
      - uses: beatlabs/delete-old-branches-action@4eeeb8740ff8b3cb310296ddd6b43c3387734588 # v0.0.11
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          date: '${{ env.BRANCHES_RETAIN_DAYS }} days ago'
          dry_run: '${{ env.DRY_RUN }}'
          delete_tags: false
          exclude_open_pr_branches: true

# NO GHCR pruning here, deliberately. Do not reinstate `prune-untagged: true`.
#
# The removed job destroyed this repo's published image. `prune-untagged`
# deletes every version that carries no tag, and on a multi-arch build the
# per-architecture manifests are exactly that: the tagged OCI index survives
# and all of its children are deleted underneath it. The result looks healthy
# from the outside (every tag still resolves, HTTP 200 on the index) while
# `docker pull` fails with "manifest unknown" for all of them, because the
# index points at manifests that no longer exist. It ran daily with
# dry-run false and no age floor, so a rebuild would have been hollowed out
# again within a day. pyck-ai/baseimages lost 168 tags to this same
# configuration before it was found there.
#
# Pruning returns when `ghcr-tidy` lands in pyck-ai/github-actions. That tool
# walks index children and treats them as reachable from the tag that points
# at them, which is the property this action lacks. Until then this repo keeps
# its untagged versions; that costs storage and nothing else.
