name: build
run-name: Build and push the flutter-rfw image

# Weekdays at 11:00 UTC. That is two hours after pyck-ai/baseimages publishes
# the base images this one builds FROM, so a scheduled run picks up the same
# day's base rather than yesterday's.
on:
  schedule:
    - cron: '0 11 * * 1-5'
  workflow_dispatch:
  # Validate every PR before merge so Renovate (and humans) always have a status check
  # to gate automerge on. PR runs push by digest only and do not export build cache
  # (see the discover step and push:/cache-to handling below).
  pull_request:

# Cancel any in-progress build for the same ref when a newer one is triggered.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/pyck-ai

jobs:
  # Read the target list from the bake file so a new variant is picked up by the
  # build matrix without touching CI.
  discover:
    runs-on: self-hosted
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      bakeargs-set: ${{ steps.targets.outputs.bakeargs-set }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Read targets and build args from bake file
        id: targets
        run: |
          set -a && source buildargs.conf && set +a
          print=$(REGISTRY=${{ env.REGISTRY }} docker buildx bake --print)
          {
            echo "targets=$(jq -c '[.target | keys[]]' <<<"$print")"
            echo 'bakeargs-set<<EOF'
            grep -v '^#' buildargs.conf | grep -v '^\s*$' | sed 's/^/*.args./'
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              # On PRs, disable cache export so an unmerged (possibly broken) bump can't
              # poison the registry build cache that scheduled builds rely on.
              echo '*.cache-to='
              # Push PR builds by digest only: clear every target's floating/version tags
              # and push with push-by-digest, so the image is uploaded for inspection
              # (reference it as <repo>@sha256:...) without writing or moving any tag such
              # as flutter-rfw:latest that scheduled and manual builds own. The repo to
              # push to is derived from each target's first tag.
              jq -rn --argjson p "$print" '
                $p.target
                | to_entries[]
                | .key as $k
                | (.value.tags[0] | sub(":[^/]+$"; "")) as $repo
                | ($k + ".tags="),
                  ($k + ".output=type=image,name=" + $repo + ",push-by-digest=true,name-canonical=true,push=true")'
            fi
            echo 'EOF'
          } >> $GITHUB_OUTPUT

  # One runner per variant so Alpine and Debian build concurrently. Each is a
  # multi-arch build; the arm64 half runs the Flutter SDK fixups under QEMU.
  build:
    needs: [discover]
    runs-on: self-hosted
    strategy:
      matrix:
        target: ${{ fromJson(needs.discover.outputs.targets) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Load build args
        run: grep -v '^#' buildargs.conf | grep -v '^\s*$' >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up buildx builder
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          driver-opts: network=host
          buildkitd-flags: --allow-insecure-entitlement=network.host

      # Needed both to pull the base image and to push the result; no image in
      # this build comes from Docker Hub, so there is no Docker Hub login here.
      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7
        with:
          targets: ${{ matrix.target }}
          # Refresh the base image so a scheduled rebuild actually picks up a new
          # base:alpine/base:debian instead of a stale local one.
          pull: true
          # On schedule/manual runs, push the full floating/version tag set. On PRs the
          # action does not push; instead `set` (from discover) clears tags and pushes
          # by digest only, so PR builds upload for inspection without moving shared tags.
          push: ${{ github.event_name != 'pull_request' }}
          set: ${{ needs.discover.outputs.bakeargs-set }}
        env:
          REGISTRY: ${{ env.REGISTRY }}

  # Cold-builds both variants single-arch with --load and runs the assembled-image
  # checks against them. Runs after the push job rather than alongside it so the
  # self-hosted pool sees one build wave at a time.
  verify:
    needs: [build]
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Nothing else in this pipeline needs `task`; the verify flow does, so
      # install it explicitly rather than assuming the runner carries it.
      - name: Install go-task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Named to match the `--builder` the Taskfile passes, and given the same
      # host-network driver options as the build job. Using the action rather
      # than `task setup` keeps host networking out of the Taskfile, which also
      # has to work under rootless Docker locally.
      - name: Set up buildx builder
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          name: flutter-rfw
          driver-opts: network=host
          buildkitd-flags: --allow-insecure-entitlement=network.host

      # `CI=` (CLI var) forces the Taskfile's single-platform --load path; the
      # step-level CI: "" documents the same intent at the workflow layer, since
      # GitHub sets CI=true which would otherwise select an unloadable multi-arch build.
      - name: Build (--load) and verify both variants
        run: task verify CI=
        env:
          CI: ""
          REGISTRY: ${{ env.REGISTRY }}

  # Single aggregate gate for the branch-protection required status check. The
  # build matrix can't be required directly: its targets are discovered
  # dynamically, and a matrix job skipped via a failed `needs` reports a bare
  # context that a required check treats as passing. This job has a stable name,
  # runs even when upstream jobs fail (if: always()), and fails unless every one
  # of them succeeded.
  gate:
    needs: [discover, build, verify]
    if: always()
    runs-on: self-hosted
    steps:
      - name: Verify all jobs succeeded
        run: |
          results="${{ needs.discover.result }} ${{ needs.build.result }} ${{ needs.verify.result }}"
          for r in $results; do
            [ "$r" = "success" ] || { echo "A job did not succeed: $results"; exit 1; }
          done
          echo "All jobs succeeded."
