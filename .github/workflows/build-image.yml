name: build-image
run-name: Build and push the flutter-rfw image

# Weekdays at 11:00 UTC. That is two hours after pyck-ai/baseimages publishes
# the base images this one builds FROM, so a scheduled run picks up the same
# day's base rather than yesterday's.
on:
  schedule:
    # Staggered across the four pyck-ai repos, which share self-hosted
    # runners: baseimages 09:00, github-runner 11:00, this repo 13:00.
    # Check the others before changing this slot.
    - cron: '0 13 * * 1-5'
  workflow_dispatch:
  # Validate every PR before merge so Renovate (and humans) always have a status check
  # to gate automerge on. PR runs push by digest only and do not export build cache
  # (see the shared workflow's discover step and push:/cache-to handling).
  pull_request:

# Cancel any in-progress build for the same ref when a newer one is triggered.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Delegates discover -> build (push-by-digest) -> verify (verify.sh run
  # inside the image) -> publish (apply tags) -> gate to the shared workflow.
  # See pyck-ai/github-actions/.github/workflows/build-image.yml for the job
  # shape; this repo no longer carries its own copy.
  build:
    permissions:
      contents: read
      packages: write
    uses: pyck-ai/github-actions/.github/workflows/build-image.yml@be8e36d4bd4c1ed4b67ba60b0d453d76355051aa
    with:
      registry: ghcr.io/pyck-ai
      # Distinct per-repo builder name so concurrent builds on the same
      # self-hosted runner don't collide on a shared default builder.
      builder-name: flutter-rfw
    secrets: inherit
